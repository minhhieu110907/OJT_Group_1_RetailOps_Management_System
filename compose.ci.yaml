services:
  backend:
    environment:
      RETAILOPS_DB_NAME: ${MYSQL_TEST_DATABASE:?Set MYSQL_TEST_DATABASE in CI env}
      RETAILOPS_DB_USER: ${MYSQL_TEST_USER:?Set MYSQL_TEST_USER in CI env}
      RETAILOPS_DB_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in CI env}

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_HOST_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15674}:15672"

  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_HOST_PORT:-18025}:8025"

networks:
  application:
    internal: false
