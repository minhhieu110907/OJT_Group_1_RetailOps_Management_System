
services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      proxy:
        ipv4_address: 172.30.10.2

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:?Set MYSQL_TEST_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_TEST_USER: ${MYSQL_TEST_USER:?Set MYSQL_TEST_USER in .env}
      MYSQL_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-create-test-database.sh:/docker-entrypoint-initdb.d/01-create-test-database.sh:ro
      - ./docker/mysql/tools/provision-existing-test-user.sh:/usr/local/bin/provision-existing-test-user:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$${MYSQL_PASSWORD} mysql --protocol=TCP --host=127.0.0.1 --user=$${MYSQL_USER} --database=$${MYSQL_DATABASE} --execute='SELECT 1' --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - application

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      RETAILOPS_ENVIRONMENT: development
      RETAILOPS_DB_HOST: mysql
      RETAILOPS_DB_PORT: 3306
      RETAILOPS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      RETAILOPS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      RETAILOPS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      RETAILOPS_CORS_ORIGINS: ${RETAILOPS_CORS_ORIGINS:-}
      RETAILOPS_JWT_SECRET: ${RETAILOPS_JWT_SECRET:?Set RETAILOPS_JWT_SECRET in .env}
      RETAILOPS_CSRF_SECRET: ${RETAILOPS_CSRF_SECRET:?Set RETAILOPS_CSRF_SECRET in .env}
      RETAILOPS_REDIS_URL: redis://redis:6379/0
      RETAILOPS_REDIS_POOL_SIZE: ${RETAILOPS_REDIS_POOL_SIZE:-10}
      RETAILOPS_REDIS_CONNECT_TIMEOUT_SECONDS: ${RETAILOPS_REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      RETAILOPS_REDIS_SOCKET_TIMEOUT_SECONDS: ${RETAILOPS_REDIS_SOCKET_TIMEOUT_SECONDS:-1}
      RETAILOPS_REGISTER_RATE_LIMIT: ${RETAILOPS_REGISTER_RATE_LIMIT:-5}
      RETAILOPS_REGISTER_RATE_WINDOW_SECONDS: ${RETAILOPS_REGISTER_RATE_WINDOW_SECONDS:-60}
      FORWARDED_ALLOW_IPS: 172.30.10.2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      application:
      proxy:
        ipv4_address: 172.30.10.3

volumes:
  mysql_data:

networks:
  application:
    internal: true
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/29
