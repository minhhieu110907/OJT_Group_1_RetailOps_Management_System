services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:?Set MYSQL_TEST_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_TEST_USER: ${MYSQL_TEST_USER:?Set MYSQL_TEST_USER in .env}
      MYSQL_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-create-test-database.sh:/docker-entrypoint-initdb.d/01-create-test-database.sh:ro
      - ./docker/mysql/tools/provision-existing-test-user.sh:/usr/local/bin/provision-existing-test-user:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$${MYSQL_PASSWORD} mysql --protocol=TCP --host=127.0.0.1 --user=$${MYSQL_USER} --database=$${MYSQL_DATABASE} --execute='SELECT 1' --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      RETAILOPS_ENVIRONMENT: development
      RETAILOPS_DB_HOST: mysql
      RETAILOPS_DB_PORT: 3306
      RETAILOPS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      RETAILOPS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      RETAILOPS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
