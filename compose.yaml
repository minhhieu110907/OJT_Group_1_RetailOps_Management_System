
services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: ${NGINX_PROXY_IP:-172.30.10.2}

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:?Set MYSQL_TEST_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_TEST_USER: ${MYSQL_TEST_USER:?Set MYSQL_TEST_USER in .env}
      MYSQL_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-create-test-database.sh:/docker-entrypoint-initdb.d/01-create-test-database.sh:ro
      - ./docker/mysql/tools/provision-existing-test-user.sh:/usr/local/bin/provision-existing-test-user:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$${MYSQL_PASSWORD} mysql --protocol=TCP --host=127.0.0.1 --user=$${MYSQL_USER} --database=$${MYSQL_DATABASE} --execute='SELECT 1' --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - application

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  rabbitmq:
    profiles: ["email"]
    image: rabbitmq:4.4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_BOOTSTRAP_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_BOOTSTRAP_PASSWORD:-}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - application

  mailpit:
    profiles: ["email-local"]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    networks:
      - application
      - proxy

  rabbitmq-bootstrap:
    profiles: ["email"]
    build:
      context: ./backend
    restart: "no"
    command: ["python", "-m", "app.worker.rabbitmq_bootstrap"]
    environment:
      RETAILOPS_RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_BOOTSTRAP_USER: ${RABBITMQ_BOOTSTRAP_USER:-}
      RABBITMQ_BOOTSTRAP_PASSWORD: ${RABBITMQ_BOOTSTRAP_PASSWORD:-}
      RABBITMQ_PUBLISHER_USER: ${RABBITMQ_PUBLISHER_USER:-}
      RABBITMQ_PUBLISHER_PASSWORD: ${RABBITMQ_PUBLISHER_PASSWORD:-}
      RABBITMQ_WORKER_USER: ${RABBITMQ_WORKER_USER:-}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - application

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      RETAILOPS_ENVIRONMENT: ${RETAILOPS_ENVIRONMENT:-development}
      RETAILOPS_COOKIE_SECURE: ${RETAILOPS_COOKIE_SECURE:-false}
      RETAILOPS_DB_HOST: mysql
      RETAILOPS_DB_PORT: 3306
      RETAILOPS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      RETAILOPS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      RETAILOPS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      RETAILOPS_CORS_ORIGINS: ${RETAILOPS_CORS_ORIGINS:-}
      RETAILOPS_JWT_SECRET: ${RETAILOPS_JWT_SECRET:?Set RETAILOPS_JWT_SECRET in .env}
      RETAILOPS_CSRF_SECRET: ${RETAILOPS_CSRF_SECRET:?Set RETAILOPS_CSRF_SECRET in .env}
      RETAILOPS_IDEMPOTENCY_SECRET: ${RETAILOPS_IDEMPOTENCY_SECRET:?Set RETAILOPS_IDEMPOTENCY_SECRET in .env}
      RETAILOPS_BENCHMARK_ATTESTATION_SECRET: ${RETAILOPS_BENCHMARK_ATTESTATION_SECRET:-}
      RETAILOPS_BENCHMARK_ISOLATED_DATABASE: ${RETAILOPS_BENCHMARK_ISOLATED_DATABASE:-}
      RETAILOPS_OUTBOX_SECRET_KEY: ${RETAILOPS_OUTBOX_SECRET_KEY:-}
      RETAILOPS_REDIS_URL: redis://redis:6379/0
      RETAILOPS_REDIS_POOL_SIZE: ${RETAILOPS_REDIS_POOL_SIZE:-10}
      RETAILOPS_REDIS_CONNECT_TIMEOUT_SECONDS: ${RETAILOPS_REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      RETAILOPS_REDIS_SOCKET_TIMEOUT_SECONDS: ${RETAILOPS_REDIS_SOCKET_TIMEOUT_SECONDS:-1}
      RETAILOPS_REGISTER_RATE_LIMIT: ${RETAILOPS_REGISTER_RATE_LIMIT:-5}
      RETAILOPS_REGISTER_RATE_WINDOW_SECONDS: ${RETAILOPS_REGISTER_RATE_WINDOW_SECONDS:-60}
      RETAILOPS_LOGIN_IP_RATE_LIMIT: ${RETAILOPS_LOGIN_IP_RATE_LIMIT:-5}
      RETAILOPS_LOGIN_IP_RATE_WINDOW_SECONDS: ${RETAILOPS_LOGIN_IP_RATE_WINDOW_SECONDS:-60}
      RETAILOPS_LOGIN_ACCOUNT_RATE_LIMIT: ${RETAILOPS_LOGIN_ACCOUNT_RATE_LIMIT:-20}
      RETAILOPS_LOGIN_ACCOUNT_RATE_WINDOW_SECONDS: ${RETAILOPS_LOGIN_ACCOUNT_RATE_WINDOW_SECONDS:-3600}
      RETAILOPS_REFRESH_RATE_LIMIT: ${RETAILOPS_REFRESH_RATE_LIMIT:-10}
      RETAILOPS_REFRESH_RATE_WINDOW_SECONDS: ${RETAILOPS_REFRESH_RATE_WINDOW_SECONDS:-60}
      RETAILOPS_BUSINESS_RATE_LIMIT: ${RETAILOPS_BUSINESS_RATE_LIMIT:-120}
      RETAILOPS_BUSINESS_RATE_WINDOW_SECONDS: ${RETAILOPS_BUSINESS_RATE_WINDOW_SECONDS:-60}
      RETAILOPS_FORGOT_PASSWORD_IP_RATE_LIMIT: ${RETAILOPS_FORGOT_PASSWORD_IP_RATE_LIMIT:-3}
      RETAILOPS_FORGOT_PASSWORD_IP_RATE_WINDOW_SECONDS: ${RETAILOPS_FORGOT_PASSWORD_IP_RATE_WINDOW_SECONDS:-3600}
      RETAILOPS_FORGOT_PASSWORD_ACCOUNT_RATE_LIMIT: ${RETAILOPS_FORGOT_PASSWORD_ACCOUNT_RATE_LIMIT:-3}
      RETAILOPS_FORGOT_PASSWORD_ACCOUNT_RATE_WINDOW_SECONDS: ${RETAILOPS_FORGOT_PASSWORD_ACCOUNT_RATE_WINDOW_SECONDS:-3600}
      RETAILOPS_GEMINI_API_KEY: ${RETAILOPS_GEMINI_API_KEY:-}
      RETAILOPS_GEMINI_MODEL: ${RETAILOPS_GEMINI_MODEL:-gemini-2.5-flash}
      RETAILOPS_GEMINI_TIMEOUT_SECONDS: ${RETAILOPS_GEMINI_TIMEOUT_SECONDS:-10}
      RETAILOPS_AI_RATE_LIMIT: ${RETAILOPS_AI_RATE_LIMIT:-10}
      RETAILOPS_AI_RATE_WINDOW_SECONDS: ${RETAILOPS_AI_RATE_WINDOW_SECONDS:-60}
      RETAILOPS_AI_MAX_CONCURRENT_REQUESTS: ${RETAILOPS_AI_MAX_CONCURRENT_REQUESTS:-5}
      FORWARDED_ALLOW_IPS: ${NGINX_PROXY_IP:-172.30.10.2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      application:
      proxy:
        ipv4_address: ${BACKEND_PROXY_IP:-172.30.10.3}

  outbox-publisher:
    profiles: ["email"]
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker.publisher_main"]
    environment:
      RETAILOPS_DB_HOST: mysql
      RETAILOPS_DB_PORT: 3306
      RETAILOPS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      RETAILOPS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      RETAILOPS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      RETAILOPS_RABBITMQ_HOST: rabbitmq
      RETAILOPS_RABBITMQ_PORT: 5672
      RETAILOPS_RABBITMQ_VHOST: /retailops
      RETAILOPS_RABBITMQ_USERNAME: ${RABBITMQ_PUBLISHER_USER:-}
      RETAILOPS_RABBITMQ_PASSWORD: ${RABBITMQ_PUBLISHER_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-bootstrap:
        condition: service_completed_successfully
    networks:
      - application

  email-worker:
    profiles: ["email"]
    build:
      context: ./backend
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "--without-gossip",
        "--without-mingle",
        "--without-heartbeat",
        "--queues=retailops.email.v1",
      ]
    environment:
      RETAILOPS_ENVIRONMENT: ${RETAILOPS_ENVIRONMENT:-development}
      RETAILOPS_DB_HOST: mysql
      RETAILOPS_DB_PORT: 3306
      RETAILOPS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      RETAILOPS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      RETAILOPS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      RETAILOPS_RABBITMQ_HOST: rabbitmq
      RETAILOPS_RABBITMQ_PORT: 5672
      RETAILOPS_RABBITMQ_VHOST: /retailops
      RETAILOPS_RABBITMQ_USERNAME: ${RABBITMQ_WORKER_USER:-}
      RETAILOPS_RABBITMQ_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:-}
      RETAILOPS_SMTP_HOST: ${RETAILOPS_SMTP_HOST:-mailpit}
      RETAILOPS_SMTP_PORT: ${RETAILOPS_SMTP_PORT:-1025}
      RETAILOPS_SMTP_USERNAME: ${RETAILOPS_SMTP_USERNAME:-}
      RETAILOPS_SMTP_PASSWORD: ${RETAILOPS_SMTP_PASSWORD:-}
      RETAILOPS_SMTP_FROM_ADDRESS: ${RETAILOPS_SMTP_FROM_ADDRESS:-no-reply@retailops.local}
      RETAILOPS_SMTP_STARTTLS: ${RETAILOPS_SMTP_STARTTLS:-false}
      RETAILOPS_OUTBOX_SECRET_KEY: ${RETAILOPS_OUTBOX_SECRET_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-bootstrap:
        condition: service_completed_successfully
    networks:
      - application

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  application:
    internal: true
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.10.0/29}
