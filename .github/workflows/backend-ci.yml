name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Backend / Ruff + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check forbidden review artifacts
        working-directory: .
        run: |
          if git ls-files | grep -E '\.(zip|tar\.gz|rar|7z)$'; then
            echo "::error::Compressed review artifacts detected in Git tracking. Please remove them."
            exit 1
          fi
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Ruff Format Check
        run: uv run --locked ruff format --check .
      - name: Check single Alembic head
        run: |
          heads_count=$(uv run --locked alembic heads | grep -c " (head)" || true)
          if [ "$heads_count" -ne 1 ]; then
            echo "::error::Multiple or zero Alembic migration heads detected: $heads_count"
            uv run --locked alembic heads
            exit 1
          fi
      - name: Unit and API tests
        run: uv run --locked pytest -m "not integration"

  mysql-integration:
    name: Backend / MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Generate isolated CI-only MySQL credentials
        run: |
          set -euo pipefail
          umask 077
          app_password="$(openssl rand -hex 24)"
          test_password="$(openssl rand -hex 24)"
          root_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          csrf_secret="$(openssl rand -hex 32)"
          idempotency_secret="$(openssl rand -hex 32)"
          {
            printf 'MYSQL_DATABASE=retailops\n'
            printf 'MYSQL_TEST_DATABASE=retailops_test\n'
            printf 'MYSQL_USER=retailops_app\n'
            printf 'MYSQL_PASSWORD=%s\n' "$app_password"
            printf 'MYSQL_TEST_USER=retailops_test_runner\n'
            printf 'MYSQL_TEST_PASSWORD=%s\n' "$test_password"
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$root_password"
            printf 'MYSQL_HOST_PORT=13306\n'
            printf 'BACKEND_HOST_PORT=18000\n'
            printf 'NGINX_HOST_PORT=18080\n'
            printf 'REDIS_HOST_PORT=16379\n'
            printf 'RETAILOPS_TEST_DATABASE_URL=mysql+pymysql://retailops_test_runner:%s@127.0.0.1:13306/retailops_test?charset=utf8mb4\n' "$test_password"
            printf 'RETAILOPS_TEST_REDIS_URL=redis://127.0.0.1:16379/15\n'
            printf 'RETAILOPS_PROXY_REDIS_URL=redis://127.0.0.1:16379/0\n'
            printf 'RETAILOPS_PROXY_BASE_URL=http://127.0.0.1:18080\n'
            printf 'RETAILOPS_JWT_SECRET=%s\n' "$jwt_secret"
            printf 'RETAILOPS_CSRF_SECRET=%s\n' "$csrf_secret"
            printf 'RETAILOPS_IDEMPOTENCY_SECRET=%s\n' "$idempotency_secret"
          } > .env
      - name: Start isolated MySQL 8.4 and Redis
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.ci.yaml up -d mysql redis
          container_id="$(docker compose -f compose.yaml -f compose.ci.yaml ps -q mysql)"
          if [[ -z "$container_id" ]]; then
            echo "::error::MySQL container was not created"
            exit 1
          fi
          # MySQL initialization is variable on fresh GitHub-hosted runners.
          # Keep health checks and a bounded deadline; never skip integration tests.
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            status="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [[ "$status" == "running" && "$health" == "healthy" ]]; then
              echo "MySQL passed its authenticated health check."
              exit 0
            fi
            if [[ "$status" == "exited" || "$status" == "dead" ]]; then
              echo "::error::MySQL terminated during startup (status: $status)."
              exit 1
            fi
            sleep 3
          done
          echo "::error::MySQL did not become healthy within 180 seconds."
          exit 1
      - name: Diagnose MySQL startup failure
        if: failure()
        run: |
          echo "## MySQL startup diagnostics" >> "$GITHUB_STEP_SUMMARY"
          docker compose -f compose.yaml -f compose.ci.yaml ps -a || true
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail=120 mysql redis || true
          container_id="$(docker compose -f compose.yaml -f compose.ci.yaml ps -q -a mysql)"
          if [[ -n "$container_id" ]]; then
            docker inspect --format '{{json .State.Health}}' "$container_id" || true
          fi
      - name: Verify clean Alembic migration and schema diffs
        working-directory: backend
        run: |
          set -euo pipefail
          set -a
          source ../.env
          set +a
          uv run --locked pytest tests/integration/test_migrations.py
      - name: MySQL integration tests (must fail if configuration is missing)
        working-directory: backend
        run: |
          set -euo pipefail
          set -a
          source ../.env
          set +a
          uv run --locked pytest -m "integration and not redis_integration and not proxy_integration"
      - name: Redis integration tests
        working-directory: backend
        run: |
          set -euo pipefail
          set -a
          source ../.env
          set +a
          uv run --locked pytest -m redis_integration
      - name: Start isolated Nginx and backend proxy topology
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.ci.yaml up -d --build backend nginx
          deadline=$((SECONDS + 120))
          until curl --fail --silent http://127.0.0.1:18080/api/v1/health >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::Nginx/backend topology did not become ready"
              exit 1
            fi
            sleep 2
          done
      - name: Trusted proxy and HTTP registration integration tests
        working-directory: backend
        run: |
          set -euo pipefail
          set -a
          source ../.env
          set +a
          uv run --locked pytest -m proxy_integration
      - name: Tear down containers and ephemeral volume
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans
