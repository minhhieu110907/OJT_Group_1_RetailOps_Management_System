      - code
      - message
      - details
    GenericMessage:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
      - message
    ProductRead:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        sale_price_vnd:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int64
          minimum: 0
        stock_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
          description: UTC ISO-8601, offsets explicit
        updated_at:
          type: string
          format: date-time
          description: UTC ISO-8601, offsets explicit
      required:
      - id
      - category_id
      - sku
      - name
      - status
      - sale_price_vnd
      - quantity
      - stock_version
      - created_at
      - updated_at
