            example:
              counted_quantity: 7
              expected_stock_version: 5
              reason: Kiểm kê thực tế
      parameters:
      - in: path
        name: product_id
        required: true
        schema:
          type: integer
      - name: Idempotency-Key
        in: header
        required: true
        description: One opaque key per intent. Preserve exact key+body for retry. New business intent uses
          new key.
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]{16,128}$
      x-idempotency:
        namespace: actor_id + operation + key_digest
        expires_after_completed_hours: 24
        single_mysql_transaction: true
        same_key_same_payload: replay status and response body
        same_key_different_payload: 409 IDEMPOTENCY_KEY_REUSED
        concurrent_duplicate: bounded wait or 409 REQUEST_IN_PROGRESS
      x-implementation-status: PLANNED_NOT_VERIFIED
      x-owner-consumer-signoff: PENDING_ON_DOCS_PR
